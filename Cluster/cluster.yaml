apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: eks-clusterA
  version: "1.31"
  region: ap-northeast-2
  tags:
    karpenter.sh/discovery: eks-clusterA

vpc:
  subnets:
    public:
      public-a: { id: subnet-0122d42ef20928c88 }
      public-b: { id: subnet-0879f5e9ee435df80 }
    private:
      private-a: { id: subnet-0a788a03f4e3375bb }
      private-b: { id: subnet-0f80bfece5c49f8d4 }

iamIdentityMappings:
  - arn: arn:aws:iam::950274644703:role/root
    groups:
      - system:masters
    username: root-admin
    noDuplicateARNs: true # prevents shadowing of ARNs

iam:
  withOIDC: true
  serviceAccounts:
  - metadata:
      name: aws-load-balancer-controller
      namespace: kube-system
    wellKnownPolicies:
      awsLoadBalancerController: true
  - metadata:
      name: ebs-csi-controller-sa
      namespace: kube-system
    wellKnownPolicies:
      ebsCSIController: true
  - metadata:
      name: karpenter
      namespace: karpenter
    attachPolicyARNs:
      - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
      - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser
      - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
    roleOnly: true

managedNodeGroups:
  - name: app-ng
    labels: { app: nga }
    instanceType: t3.small
    instanceName: app-node
    desiredCapacity: 2
    minSize: 2
    maxSize: 20
    amiFamily: Bottlerocket
    privateNetworking: true
    volumeType: gp2
    volumeEncrypted: true
    iam:
      withAddonPolicies:
        imageBuilder: true
        awsLoadBalancerController: true
        autoScaler: true

  - name: addon-ng
    labels: { app: addon }
    instanceType: t3.small
    instanceName: addon-node
    desiredCapacity: 2
    minSize: 2
    maxSize: 20
    amiFamily: Bottlerocket
    privateNetworking: true
    volumeType: gp2
    volumeEncrypted: true
    iam:
      withAddonPolicies:
        imageBuilder: true
        awsLoadBalancerController: true
        autoScaler: true
        

addons:
  - name: aws-ebs-csi-driver
    version: "latest"
    serviceAccountRoleARN: arn:aws:iam::950274644703:role/ebs-csi-controller-sa
  - name: eks-pod-identity-agent
    version: "latest"
