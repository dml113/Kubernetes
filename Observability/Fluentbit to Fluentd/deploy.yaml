apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-a
  template:
    metadata:
      labels:
        app: service-a
    spec:
      containers:
        - name: service-a
          image: ${data.aws_caller_identity.current.account_id}.dkr.ecr.ap-northeast-2.amazonaws.com/service:a
          volumeMounts:
            - name: applog
              mountPath: /log
        - name: fluent-bit
          image: fluent/fluent-bit:latest
          volumeMounts:
            - name: applog
              mountPath: /var/log/service-a/
              readOnly: true
            - name: fluent-bit-config
              mountPath: /fluent-bit/etc
      volumes:
        - name: applog
          emptyDir: {}
        - name: fluent-bit-config
          configMap:
            name: fluent-bit-config
      restartPolicy: Always
---
