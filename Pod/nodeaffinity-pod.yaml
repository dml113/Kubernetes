apiVersion: v1
kind: Pod
metadata:
  name: a-nginx
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topology.kubernetes.io/zone
            operator: In
            values:
            - ap-northeast-2a
  containers:
  - name: nginx
    image: nginx
    imagePullPolicy: IfNotPresent
