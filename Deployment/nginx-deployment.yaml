apiVersion: apps/v1
kind: Deployment
metadata:
  name: a-deployment
  namespace: a
spec:
  selector:
    matchLabels:
      app: a
  replicas: 4
  template:
    metadata:
      labels:
        app: a
    spec:
      containers:
      - name: a
        image: nginx
        ports:
        - containerPort: 80
        volumeMounts:
          - name: nginx-index-file
            mountPath: /usr/share/nginx/html/
      volumes:
      - name: nginx-index-file
        configMap:
          name: index-html-configmap-a
---
