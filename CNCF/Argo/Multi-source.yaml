apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-deploy
  namespace: argocd
spec:
  destination:
    namespace: prometheus
    server: https://kubernetes.default.svc
  sources:
  - path: ''
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 27.3.1
    chart: prometheus

  - path: app
    repoURL: https://github.com/dml113/prometheus-ingress
    targetRevision: HEAD

  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
