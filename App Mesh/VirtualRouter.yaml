apiVersion: appmesh.k8s.aws/v1beta2
kind: VirtualRouter
metadata:
  name: main-static-router
  namespace: skills
spec:
  awsName: main-static-virtual-router
  listeners:
    - portMapping:
        port: 80
        protocol: http
  routes:
